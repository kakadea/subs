services:
  app:
    image: subs-app:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ADDR: ":8080"
      APP_ENV: "production"
      BASE_URL: "${BASE_URL:-https://subs.example.com}"
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      DATABASE_DSN: "subs:${DB_PASSWORD:?set DB_PASSWORD}@tcp(mariadb:3306)/subs?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci"
      STORAGE_ROOT: "/data"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-25}"
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-168}"
      DOWNLOAD_LINK_TTL_HOURS: "${DOWNLOAD_LINK_TTL_HOURS:-24}"
      SESSION_SECRET: "${SESSION_SECRET:?set SESSION_SECRET}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:?set ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?set ADMIN_PASSWORD}"
    expose:
      - "8080"
    volumes:
      - subtitles_data:/data
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - subs_internal

  nginx-files:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOCAL_PROXY_PORT:-8081}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - subtitles_data:/data:ro
    depends_on:
      - app
    networks:
      - subs_internal

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--max-connections=80"]
    environment:
      MARIADB_DATABASE: subs
      MARIADB_USER: subs
      MARIADB_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - subs_internal

networks:
  subs_internal:
    driver: bridge
    internal: true

volumes:
  subtitles_data:
  mariadb_data:
