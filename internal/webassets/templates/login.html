{{define "content"}}
<section class="auth-shell">
  <div class="auth-card">
    <div class="eyebrow">Área administrativa</div>
    <h1>Bem-vindo de volta.</h1>
    <p class="muted">Entre para administrar o catálogo de legendas.</p>
    {{if .Error}}<div class="alert alert-error">{{.Error}}</div>{{end}}
    {{if .Success}}<div class="alert alert-success">{{.Success}}</div>{{end}}
    <form method="post" action="/login" class="stack-form">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required autocomplete="email" placeholder="admin@exemplo.com">
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" required minlength="12" autocomplete="current-password" placeholder="Mínimo de 12 caracteres">
      <button class="primary-button" type="submit">Entrar no painel <span>→</span></button>
    </form>
  </div>
</section>
{{end}}
